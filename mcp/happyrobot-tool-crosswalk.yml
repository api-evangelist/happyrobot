notes: >-
  Binds each of Happyrobot's PUBLISHED MCP tools to the REST operation(s) in the Happyrobot Public API
  that back it, so a tool inherits a REAL input contract — that operation's parameters plus requestBody —
  instead of a guessed one. The tool names and descriptions are the vendor's own, taken verbatim from the
  @happyrobot-ai/mcp and @happyrobot-ai/mcp-twin READMEs; the REST bindings were mapped by semantics and
  then MECHANICALLY VERIFIED — every one of the 150 operations referenced below was confirmed to exist
  verbatim in openapi/happyrobot-public-api-openapi.json. Because the OpenAPI declares no operationIds,
  operations are addressed by `METHOD /path`.
  Confidence is `high` where the tool description names the operations unambiguously and `medium` where a
  coarse `manage_*` tool fans out over a whole resource family and the exact subset it exposes cannot be
  confirmed without an authenticated tools/list.
