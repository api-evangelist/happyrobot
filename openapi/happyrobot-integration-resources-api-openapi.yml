openapi: 3.2.0
info:
  title: Happyrobot Public Integration Resources API
  description: Public API endpoints for Happyrobot
  version: 0.1.1
servers:
- url: https://platform.happyrobot.ai/api/v2
security:
- bearerAuth: []
tags:
- name: Integration Resources
