- name: Happyrobot Workflows MCP Server
  description: >-
    Happyrobot's first-party remote MCP server for building and governing workflows — 26 published tools
    plus 5 MCP prompts, served over Streamable HTTP and protected by OAuth 2.0 (scope mcp:full, RFC 9728
    protected-resource metadata, RFC 7591 dynamic client registration, PKCE S256). It supersedes the now
    deprecated stdio package @happyrobot-ai/mcp. The tool surface is builder-shaped: it covers workflow
    authoring, versioning, testing, evaluation and red-teaming, telephony and integrations, and binds to
    150 of the 205 Public API operations. Live tools/list is auth-gated; the published tool list is
    captured verbatim from the vendor's own package documentation.
  humanURL: https://docs.happyrobot.ai/developer-tools/mcp
  baseURL: https://mcp.platform.happyrobot.ai/workflows/mcp
  tags:
  - mcp
  - agent-native
  - ai-agents
  - workflow-automation
  properties:
  - type: MCPServer
    url: mcp/happyrobot-mcp.yml
  - type: ToolCrosswalk
    url: mcp/happyrobot-tool-crosswalk.yml
  - type: MCPServer
    url: https://mcp.platform.happyrobot.ai/workflows/mcp
  - type: OAuthScopes
    url: scopes/happyrobot-scopes.yml
  - type: Documentation
    url: https://docs.happyrobot.ai/developer-tools/mcp
- name: Happyrobot Twin MCP Server
  description: >-
    First-party remote MCP server over the customer's Twin database — 9 published tools covering schema
    introspection, paginated reads, table creation, row insert/update/delete, table drop, and arbitrary SQL
    execution (SELECT, INSERT, UPDATE, DELETE and DDL). Streamable HTTP, OAuth 2.0 under the same single
    coarse mcp:full scope as the Workflows server, so there is no read-only scope with which to bind a
    research agent. Supersedes the deprecated stdio package @happyrobot-ai/mcp-twin.
  humanURL: https://docs.happyrobot.ai/developer-tools/mcp-twin
  baseURL: https://mcp.platform.happyrobot.ai/twin/mcp
  tags:
  - mcp
  - agent-native
  - database
  properties:
  - type: MCPServer
    url: mcp/happyrobot-mcp.yml
  - type: ToolCrosswalk
    url: mcp/happyrobot-tool-crosswalk.yml
  - type: MCPServer
    url: https://mcp.platform.happyrobot.ai/twin/mcp
  - type: OAuthScopes
    url: scopes/happyrobot-scopes.yml
- name: Happyrobot Docs MCP Server
  description: >-
    A hosted documentation-search MCP server on the docs host, discovered via RFC 9728 protected-resource
    metadata at https://docs.happyrobot.ai/.well-known/oauth-protected-resource. It advertises a single
    mcp:search scope through its own authorization server at https://docs.happyrobot.ai/mcp/oauth. The
    endpoint answers MCP JSON-RPC with HTTP 401 invalid_token plus a WWW-Authenticate Bearer challenge that
    points back at the protected-resource document, so its tool list requires an authenticated introspection.
  humanURL: https://docs.happyrobot.ai
  baseURL: https://docs.happyrobot.ai/mcp
  tags:
  - mcp
  - agent-native
  - documentation
  properties:
  - type: MCPServer
    url: mcp/happyrobot-mcp.yml
  - type: OAuthScopes
    url: scopes/happyrobot-scopes.yml
