status: published
notes: >-
  Happyrobot publishes TWO first-party remote MCP servers — Workflows and Twin — as OAuth-protected
  Streamable HTTP endpoints on mcp.platform.happyrobot.ai, mirrored on an EU cluster. Each began life as a
  stdio npm package (@happyrobot-ai/mcp, @happyrobot-ai/mcp-twin); both packages are now explicitly marked
  DEPRECATED in favour of the remote servers, and their READMEs are the authoritative published tool
  inventories captured below. Live tools/list is OAuth-gated (HTTP 401 with a correct RFC 9728
  WWW-Authenticate challenge), so the tool NAMES and DESCRIPTIONS here are the vendor's own published ones
  while per-tool inputSchema still requires an authenticated introspection.
  Separately, docs.happyrobot.ai runs a Mintlify documentation-search MCP server (scope mcp:search).
