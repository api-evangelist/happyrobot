  /nodes/{node_id}/custom-evals/extract-from-run:
    post:
      summary: Extract custom eval from a run
      tags:
      - Custom Evals
      description: Build a custom eval from an existing run. Auto-extracts messages, variables, and suggests a name.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                run_id:
                  type: string
                  format: uuid
                  pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                message_id:
                  type: string
                  format: uuid
                  pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
              required:
              - run_id
              - message_id
        required: true
      parameters:
      - schema:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        in: path
        name: node_id
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    items:
                      type: object
                      additionalProperties: {}
                  variables:
                    type: object
                    additionalProperties: {}
                  suggested_name:
                    type: string
                  source_run_id:
                    type: string
                  navigation_info:
                    type: object
                    properties:
                      prompt_node_id:
                        type: string
                      workflow_id:
                        type: string
                    required:
                    - prompt_node_id
                    - workflow_id
                    additionalProperties: false
                required:
                - messages
                - variables
                - suggested_name
                - source_run_id
                - navigation_info
