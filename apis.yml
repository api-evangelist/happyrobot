- name: Happyrobot Platform API v1
  description: >-
    The legacy v1 read API, described by an OpenAPI 3.0.2 document at /api/v1/openapi.json. Ten read-only
    operations covering runs, run recordings, use cases, workflow versions, issues and organization usage.
    Authenticated with an `authorization` header plus an `x-organization-id` header. One operation
    (GET /use-cases/{use_case_id}/runs) is explicitly marked DEPRECATED in favour of the v2 /runs endpoint.
