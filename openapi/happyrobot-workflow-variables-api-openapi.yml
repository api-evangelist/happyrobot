                value_staging:
                  type: string
                value_development:
                  type: string
                is_hidden_in_ui:
                  default: false
                  type: boolean
              required:
              - key
              - value_production
              - value_staging
              - value_development
        required: true
      parameters:
      - schema:
          type: string
          minLength: 1
        in: path
        name: workflow_id
        required: true
        description: Workflow UUID or slug
      security:
