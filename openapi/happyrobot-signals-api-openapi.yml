  /signals/:
    post:
      summary: Publish an immediate signal
      tags:
      - Signals
      description: Publishes a signal to internal signal service. payload.org_id is always derived from API key org. Built-in keys (org., usecase., session.) are allowed for targeting active sessions.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                key:
                  type: string
                  minLength: 1
                  maxLength: 256
                  pattern: ^[a-zA-Z0-9_\-.*#]+(?:\.[a-zA-Z0-9_\-.*#]+)*$
                keys:
                  minItems: 1
                  type: array
                  items:
                    type: string
                    minLength: 1
                    maxLength: 256
                    pattern: ^[a-zA-Z0-9_\-.*#]+(?:\.[a-zA-Z0-9_\-.*#]+)*$
                env:
                  type: string
                  enum:
                  - production
                  - staging
                  - development
                payload:
                  type: object
                  additionalProperties: {}
                metadata:
                  type: object
                  additionalProperties: {}
              required:
              - payload
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  dispatch_id:
                    type: string
                  signal_id:
                    type: string
                  status:
                    type: string
                  published_at:
                    type: string
                  keys:
                    type: array
                    items:
                      type: string
                  signals:
                    type: array
                    items:
                      type: object
                      properties:
                        signal_id:
                          type: string
                        key:
                          type: string
                        status:
                          type: string
                      required:
                      - signal_id
                      - key
                      - status
                      additionalProperties: false
                required:
                - status
                - published_at
                additionalProperties: false
        '400':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  statusCode:
                    type: integer
                    minimum: -9007199254740991
                    maximum: 9007199254740991
