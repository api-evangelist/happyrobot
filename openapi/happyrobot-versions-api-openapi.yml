    post:
      summary: Add nodes to a version
      tags:
      - Versions
      description: 'Adds one or more nodes to the specified version. Nodes are processed sequentially in array order, so later nodes can reference earlier ones via `parent_node_index` (0-based index into this array) or existing DB nodes via `parent_node_id`. Each node must include a `type` discriminator: `"trigger"`, `"action"`, `"agent"`, `"tool"`, `"prompt"`, `"condition"`, `"module-change"`, `"loop"`, `"path"`, or `"loop_break"`. When a trigger node is included, all existing nodes in the version are replaced and the batch defines the entire workflow from scratch. The entire operation is atomic — if any node fails, all changes are rolled back.'
