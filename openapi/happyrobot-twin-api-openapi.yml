      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                primaryKey:
                  type: object
                  additionalProperties: {}
                updates:
                  type: object
                  additionalProperties: {}
              required:
              - primaryKey
              - updates
        required: true
      parameters:
      - schema:
          type: string
        in: path
        name: tableName
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
