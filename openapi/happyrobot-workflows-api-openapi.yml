  /workflows/{workflow_id}/duplicate:
    post:
      summary: Duplicate a workflow
      tags:
      - Workflows
      description: 'Creates a copy of a workflow including all its nodes and configurations. The duplicated workflow is created as a new unpublished workflow with version number 1. If the source uses workflow engine v2, the duplicate remains an editable v2 draft and cannot be published through the public API until upgraded to v3. The existing published v2 source remains live and continues running until explicitly unpublished.


        - **name** — Optional. Display name for the new workflow. Defaults to `''{original name} Copy''`.

        - **version_id** — Optional. The specific version to duplicate. Defaults to the latest version of the source workflow.

        - **org_id** — Optional. Target organization for the copy. Defaults to the API key''s organization. Cross-org duplication requires access to both organizations.


        Sensitive configurations (e.g. phone numbers, SIP trunks) are cleared during duplication and must be reconfigured.'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  description: Display name for the new workflow. When omitted, defaults to '{original workflow name} Copy'.
                  type: string
                  minLength: 1
                org_id:
                  description: Target organization ID for the duplicated workflow. Defaults to the organization of the API key. Cross-org duplication requires access to both organizations.
                  type: string
                  format: uuid
                  pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                version_id:
                  description: The version to duplicate. When omitted, defaults to the latest version of the source workflow.
                  type: string
                  format: uuid
                  pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                wait_for_test_all:
                  default: false
                  description: When true, block until the post-duplication test-all finishes and return per-node results in `test_all_results`. When false (default), test-all is fired in the background and the response returns immediately.
                  type: boolean
