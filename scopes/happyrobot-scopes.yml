notes: >-
  Neither OpenAPI document declares an oauth2 securityScheme — the Public API uses a bearer API key — so
  `derive-oauth-scopes.py` correctly found nothing. The scopes below were instead read from the three live
  RFC 8414 / OIDC discovery documents Happyrobot publishes. Two of the three planes expose exactly one
  coarse scope each; there is no per-resource or read/write scope taxonomy on either MCP surface.
