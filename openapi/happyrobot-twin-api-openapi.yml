                additionalProperties: false
    delete:
      summary: Delete rows from a Twin table
      tags:
      - Twin
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                rowKeys:
                  type: array
                  items:
                    type: object
                    additionalProperties: {}
              required:
              - rowKeys
        required: true
      parameters:
      - schema:
          type: string
        in: path
        name: tableName
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  deletedCount:
                    type: number
                required:
