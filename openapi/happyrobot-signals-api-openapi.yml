  /signals/scheduled-signals:
    post:
      summary: Schedule a delayed signal
      tags:
      - Signals
      description: Schedules a delayed signal in internal signal service. payload.org_id is always derived from API key org.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                key:
                  type: string
                  minLength: 1
                  maxLength: 256
                  pattern: ^[a-zA-Z0-9_\-.*#]+(?:\.[a-zA-Z0-9_\-.*#]+)*$
                env:
                  type: string
                  enum:
                  - production
                  - staging
                  - development
                payload:
                  type: object
                  additionalProperties: {}
                delay_seconds:
                  type: integer
                  maximum: 9007199254740991
                metadata:
                  type: object
                  additionalProperties: {}
              required:
              - key
              - payload
              - delay_seconds
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  scheduled_signal_id:
                    type: string
                  status:
                    type: string
                  deliver_at:
                    type: string
                required:
                - scheduled_signal_id
                - status
                - deliver_at
                additionalProperties: false
        '400':
          description: Default Response
