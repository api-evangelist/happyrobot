                - error
                additionalProperties: false
    post:
      summary: Create a SIP trunk
      tags:
      - SIP Trunks
      description: Creates a new SIP trunk with inbound and outbound LiveKit trunks. Rate limited to one creation every 10 minutes per organization. Send force=true in the body to bypass this limit (use with caution — each trunk has a recurring monthly cost).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                number:
                  type: string
                  minLength: 1
                  pattern: ^\+\d+$
                name:
                  type: string
                  minLength: 1
                address:
                  type: string
                transport:
                  default: udp
                  type: string
                  enum:
                  - udp
                  - tcp
                  - tls
                auth_username:
                  type: string
                auth_password:
                  type: string
                allowed_addresses:
                  type: array
                  items:
                    type: string
                    minLength: 1
                    pattern: ^(?:(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)\.){3}(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)(?:\/(?:3[0-2]|[12]\d|[1-9]))?$
                attributes_to_headers:
                  type: object
                  additionalProperties:
                    type: string
                    minLength: 1
                    pattern: ^[!#$%&'*+\-.^_`|~0-9A-Za-z]+$
                provider:
                  type: string
                  enum:
                  - twilio
                  - telnyx
                  - custom
                direction:
