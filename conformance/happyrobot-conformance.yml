      The Owner/Editor/Viewer model is reflected in the API — POST and DELETE /org/members/ manage
      membership, and 403 is declared on 20 operations.
    data_residency: >-
      Independently verified — a fully separate EU cluster (platform.eu.happyrobot.ai) serves its own
      OpenAPI, its own OAuth authorization server and its own MCP host.
    retention: workflow settings include a data-retention configuration block (PATCH /workflows/{workflow_id}).
