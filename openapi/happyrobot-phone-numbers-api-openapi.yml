  /phone-numbers/tollfree-verification:
    get:
      summary: Get toll-free verification status
      tags:
      - Phone Numbers
      description: Returns toll-free verification status and submitted data for a phone number. Returns 204 when no verification exists.
      parameters:
      - schema:
          type: string
          minLength: 1
        in: path
        name: phone_number_id
        required: true
        description: Phone number ID (Twilio SID or Telnyx ID)
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  sid:
                    type: string
                  business_name:
                    type: string
                  business_website:
                    type: string
                  notification_email:
                    type: string
                  tollfree_phone_number_sid:
                    type: string
