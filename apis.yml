apis:
- name: Happyrobot Public API
  description: >-
    The current Happyrobot Public API (v2) — 205 operations over 162 paths, described by a live OpenAPI 3.0.3
    document served from the API host at /api/v2/docs/json. Covers workflows, workflow folders and variables,
    versions and nodes, runs, sessions and messages, contacts and contact memories, knowledge bases, phone
    numbers, SIP trunks, toll-free verification, integrations (Slack, Teams, WhatsApp, Google Sheets, Twilio
    SMS, Telnyx SMS), chat and voice session tokens, realtime tokens, signals and scheduled signals, the Twin
    data store, billing usage, organization and members, MCP server registration, and the agent-quality
    surface (audits, issues, northstars, custom evals, adversarial tests and suites). Bearer API key auth,
    applied to every operation.
  humanURL: https://docs.happyrobot.ai/api-reference
  baseURL: https://platform.happyrobot.ai/api/v2
