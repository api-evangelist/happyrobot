core_shape: >-
  Organization -> Workflow -> Version -> Node is the spine of the whole model. Everything else hangs off
  one of those four. Runs are executions of a Version; Sessions and Messages are the conversation record
  inside a Run; the entire quality layer (northstars, custom evals, adversarial tests and suites) attaches
  to a NODE, not to a workflow — which is why so many paths begin /nodes/{node_id}/.
