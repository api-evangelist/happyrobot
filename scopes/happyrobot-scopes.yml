gaps:
- The Public API itself has no OAuth scope model — a bearer API key is all-or-nothing within its
  organization and environment.
- The platform MCP server advertises a single `mcp:full` scope, so an agent granted MCP access to the
  platform inherits the full 205-operation surface, including destructive operations such as
  DELETE /workflows/{workflow_id} and POST /runs/{run_id}/cancel.
