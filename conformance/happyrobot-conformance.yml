- id: openid-connect
  conforms: true
  evidence: console sign-in uses authorization code + PKCE with scope "openid profile email offline_access".
- id: rfc9116-security-txt
  conforms: true
  evidence: >-
    https://happyrobot.ai/.well-known/security.txt returns Contact, Expires, Hiring and
