findings:
- >-
  The MCP surface is deliberately BUILDER-shaped, not RUNTIME-shaped. All 26 Workflows tools sit on
  authoring, versioning, testing and evaluating workflows; the runtime data plane — contacts and their
  memories, knowledge bases, chat and voice sessions, message flags, signals and billing — is REST-only.
  An agent given mcp:full can rebuild and republish a customer's workflows but cannot, through MCP, read
  the conversation data those workflows produce.
- >-
  Roughly a quarter of the API (55 of 205 operations) has no MCP tool at all, so REST remains mandatory
  for any integration that touches conversation history, contact memory, knowledge-base ingestion or
  usage/billing.
- >-
  The Twin server is a full SQL surface, including execute_sql (arbitrary SELECT/INSERT/UPDATE/DELETE/DDL)
  and drop_table. Both are reachable under the same single coarse mcp:full scope as read-only tools, with
  no narrower scope available to bind a read-only agent.
gaps:
- The OpenAPI declares no operationIds, so every binding here is positional on METHOD + path and will
  break silently if a path is renamed.
- The platform authorization server advertises exactly one scope (mcp:full), so tool-level or
  read-only authorization is not expressible.
