      description: Updates a scheduled signal. When payload is provided, payload.org_id is always derived from API key org.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                key:
                  type: string
                  minLength: 1
                  maxLength: 256
                  pattern: ^[a-zA-Z0-9_\-.*#]+(?:\.[a-zA-Z0-9_\-.*#]+)*$
                env:
                  type: string
                  enum:
                  - production
                  - staging
                  - development
                payload:
                  type: object
                  additionalProperties: {}
                delay_seconds:
                  type: integer
                  maximum: 9007199254740991
                metadata:
                  type: object
                  additionalProperties: {}
      parameters:
      - schema:
          type: string
        in: path
        name: scheduled_signal_id
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  scheduled_signal_id:
                    type: string
