    delete:
      summary: Delete a node
      tags:
      - Versions
      description: Deletes the specified node. For tool, condition, and paths-root nodes, owned child nodes are also cascade-deleted. For action, prompt, and module-change nodes, children are reparented to the deleted node's parent so the workflow chain is preserved. Agent nodes delete their internal children (prompt + tools) while reparenting downstream workflow nodes. The trigger node (root node with no parent) cannot be deleted.
      parameters:
      - schema:
          type: string
          minLength: 1
        in: path
        name: version_id
        required: true
        description: Version UUID or slug
      - schema:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        in: path
        name: node_id
        required: true
        description: Node UUID to delete
      security:
      - bearerAuth: []
