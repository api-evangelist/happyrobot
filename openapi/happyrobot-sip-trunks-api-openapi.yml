                force:
                  description: 'Set to true to bypass the 10-minute rate limit between SIP trunk creations. Use with caution: each SIP trunk incurs a recurring monthly cost.'
                  type: boolean
              required:
              - number
              - name
        required: true
      security:
      - bearerAuth: []
      responses:
