    put:
      summary: Update a node
      tags:
      - Versions
      description: 'Updates the specified node. The request body must include a `type` discriminator matching the node type. Updatable fields depend on the type:

        - **trigger**: `name`, `configuration`, `webhook_payload`

        - **action**: `name`, `configuration`, `webhook_payload`

        - **agent**: `name`, `configuration`, `prompt`

        - **tool**: `name`, `function`

        - **prompt**: `name`, `prompt_md`, `initial_message`, `model`

        - **condition**: `name`, `type_of_condition`, `order`, `conditions`

        - **module-change**: `name`, `configuration`

        - **loop**: `name`, `execute_in_parallel`, `iterate_for`, `iterate_over`, `loop_variable` (collection loops only), `do_child_run`

        - **path**: `name`

        - **loop_break**: `name`


        When `configuration` is provided for action/agent nodes, it is validated against the event-specific schema from the events registry.'
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
                properties:
                  type:
                    type: string
                    enum:
                    - trigger
                  event_id:
                    type: string
                    format: uuid
                    pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$
                    description: The trigger event ID
                  name:
                    description: Display name override
                    type: string
                  configuration:
                    description: Trigger-specific configuration (JSONB)
                    type: object
                    additionalProperties: {}
                  webhook_payload:
                    description: Expected payload for webhook nodes. When provided, this is saved as the node output so downstream nodes can reference it.
                    type: object
                    additionalProperties: {}
                required:
                - type
                - event_id
              - type: object
                properties:
                  type:
                    type: string
                    enum:
                    - action
                  event_id:
                    type: string
                    format: uuid
                    pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$
                    description: The action event ID
                  name:
                    description: Display name override
                    type: string
                  configuration:
                    description: Action-specific configuration (JSONB)
                    type: object
                    additionalProperties: {}
                  webhook_payload:
                    description: Expected payload for webhook nodes. When provided, this is saved as the node output so downstream nodes can reference it.
                    type: object
                    additionalProperties: {}
                required:
                - type
                - event_id
              - type: object
                properties:
                  type:
                    type: string
                    enum:
                    - agent
                  event_id:
                    type: string
                    format: uuid
                    pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$
                    description: The agent event ID
                  name:
                    description: Display name override
                    type: string
                  configuration:
                    description: Agent-specific configuration (JSONB)
                    type: object
                    additionalProperties: {}
                  prompt:
                    description: Prompt configuration for the auto-generated prompt child node
                    type: object
                    properties:
                      prompt_md:
                        description: Agent system prompt in markdown
                        type: string
                      initial_message:
                        description: Agent initial message — accepts a plain string or Plate paragraph array
                        type: array
                        items: {}
                      initial_message_uninterruptible:
                        description: Whether the voice agent initial message is uninterruptible.
                        type: boolean
                required:
                - type
                - event_id
              - type: object
                properties:
                  type:
                    type: string
                    enum:
                    - prompt
                  name:
                    description: Display name override
                    type: string
                  prompt_md:
                    description: System prompt in markdown (prompt nodes only)
                    type: string
                  initial_message:
                    description: Initial message — accepts a plain string or Plate paragraph array (prompt nodes only)
                    type: array
                    items: {}
                  initial_message_uninterruptible:
                    description: Whether the voice agent initial message is uninterruptible.
                    type: boolean
                  model:
                    description: 'LLM model selection as a TemplatedValue (e.g. { type: "static", static: { id: "turbo-one", name: "gpt-4.1" } }).'
                    type: object
                    properties:
                      type:
                        type: string
                        enum:
                        - static
                        - dynamic
                      static:
                        type: object
                        properties:
                          id:
                            type: string
                          name:
                            type: string
                          description:
                            type: string
                        required:
                        - id
                        - name
                      dynamic:
                        type: array
                        items:
                          description: '!IMPORTANT: This schema describes one Paragraph object. When the containing field is an array of this schema, send a flat Paragraph[] array. Do not send a bare Paragraph object. Only send Paragraph[][] when the containing field is explicitly an array of arrays. Paragraph object schema: {type: ''paragraph'', children: Array<{text: string} | {type: ''variable'', children: [{text: ''''}], group_id: string, variable_id: string}>}'
                    required:
                    - type
                required:
                - type
              - type: object
                properties:
                  type:
                    type: string
                    enum:
                    - tool
                  name:
                    description: Display name override
                    type: string
                  function:
                    description: Tool function definition.
                    type: object
                    properties:
                      description:
                        type: array
                        items: {}
                      message:
                        type: object
                        properties:
                          type:
                            type: string
                            enum:
                            - ai
                            - fixed
                            - none
                          description:
                            type: array
                            items: {}
                          example:
                            type: string
                      parameters:
                        type: array
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                            description:
                              type: array
                              items: {}
                            example:
                              type: string
                            required:
                              type: boolean
                          required:
                          - name
                      hold_music:
                        type: object
                        properties:
                          type:
                            type: string
                            enum:
                            - static
                            - dynamic
                          static:
                            type: object
                            properties:
                              id:
                                type: string
                              name:
                                type: string
                              description:
                                type: string
                            required:
                            - id
                            - name
                          dynamic:
                            type: array
                            items:
                              description: '!IMPORTANT: This schema describes one Paragraph object. When the containing field is an array of this schema, send a flat Paragraph[] array. Do not send a bare Paragraph object. Only send Paragraph[][] when the containing field is explicitly an array of arrays. Paragraph object schema: {type: ''paragraph'', children: Array<{text: string} | {type: ''variable'', children: [{text: ''''}], group_id: string, variable_id: string}>}'
                        required:
                        - type
                      hold_music_asset_id:
                        type: string
                        format: uuid
                        pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                      tool_index_id:
                        type: string
                      tool_index_hash:
                        type: string
                      is_mcp:
                        type: boolean
                      mcp_server_credential_id:
                        type: string
                      mcp_tool_name:
                        type: string
                required:
                - type
              - type: object
                properties:
                  type:
                    type: string
                    enum:
                    - condition
                  name:
                    description: Display name override
                    type: string
                  type_of_condition:
                    description: Type of condition branch. "conditional" evaluates rules, "fallback" catches unmatched cases.
                    type: string
                    enum:
                    - fallback
                    - conditional
                  order:
                    description: Order among sibling conditional branches. Auto-calculated if omitted.
                    type: integer
                    minimum: -9007199254740991
