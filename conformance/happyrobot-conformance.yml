  - EU AI Act
  - NIST CSF
  - DORA
  attestation_access: >-
    The security page states that documentation is "available to qualified customers under NDA" — the
    reports themselves are not public.
  security_controls_claimed:
  - end-to-end encryption with per-workflow retention policies
  - zero-trust network architecture
  - role-based access control (Owner, Editor, Viewer)
  - per-customer encryption keys on dedicated deployments
  - multi-availability-zone infrastructure with automatic failover
  - in-country data residency
  - data never used to train models, never shared across tenants
  corroboration_in_api:
