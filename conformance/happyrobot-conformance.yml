- id: oauth2
  conforms: true
  evidence: >-
    Three OAuth 2.0 authorization servers publish metadata: platform.happyrobot.ai (MCP, scope mcp:full),
    platform.eu.happyrobot.ai (EU mirror), and docs.happyrobot.ai/mcp/oauth (scope mcp:search).
- id: rfc8414-oauth-authorization-server-metadata
  conforms: true
  evidence: >-
    /.well-known/oauth-authorization-server returns valid metadata on platform.happyrobot.ai,
    platform.eu.happyrobot.ai, mcp.platform.happyrobot.ai and docs.happyrobot.ai.
- id: rfc9728-oauth-protected-resource-metadata
  conforms: true
  evidence: >-
    /.well-known/oauth-protected-resource/{workflows,twin}/mcp return resource metadata naming the
    authorization server and scopes; the MCP endpoints emit a matching WWW-Authenticate Bearer challenge
    carrying resource_metadata on a 401.
- id: rfc7591-dynamic-client-registration
  conforms: true
  evidence: >-
    registration_endpoint advertised at https://platform.happyrobot.ai/api/mcp/register and
