documentation_access:
  host: https://docs.happyrobot.ai
  state: gated
  observed: >-
    Every path on the docs host returns an identical 34,022-byte application shell whose rendered content
    is "Access Restricted — provide your access code below". Pages that search engines have indexed
    (/getting_started, /api-reference/*, /general/pricing) are no longer anonymously readable.
  impact: >-
    A developer evaluating Happyrobot cannot read the API reference, the error reference, the changelog or
    the rate-limit policy without being granted an access code — even though the OpenAPI itself is served
    publicly and anonymously from the API host.
resource_lifecycle:
  note: >-
    Distinct from API lifecycle — Happyrobot models the lifecycle of the customer's own workflows as
    first-class API operations, which is unusual and worth recording.
  states: draft version -> locked -> published -> unpublished
