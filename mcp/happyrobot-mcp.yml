prompts:
  note: >-
    The Workflows MCP server also ships five wiki-style MCP prompts that inject domain knowledge into the
    model's context — an unusually mature use of the prompts primitive, which most published MCP servers
    omit entirely.
  items:
  - name: variable-guide
    invocation: /mcp__happyrobot__variable-guide
    covers: >-
      Variable syntax rules ({{index.field}} vs {{persistent_id.field}}), output path patterns per node
      type, common mistakes, condition value format, diagnosing broken references.
  - name: node-types
    invocation: /mcp__happyrobot__node-types
    covers: What each node type does, key config fields, outputs, and common pitfalls.
  - name: workflow-patterns
    invocation: /mcp__happyrobot__workflow-patterns
    covers: Tool sequencing, version management patterns, when to use which inspection tool.
  - name: eval-guide
    invocation: /mcp__happyrobot__eval-guide
    covers: >-
      How northstars, custom evals, adversarial tests and suites layer; extracting evals from production
      runs.
  - name: platform-setup
    invocation: /mcp__happyrobot__platform-setup
    covers: >-
      Integration/credential discovery, phone numbers, SIP trunks, MCP server connections, workflow
      variables.
customer_facing_mcp_surface:
  note: >-
    Distinct from the servers above — Happyrobot is also an MCP *client*. The Public API lets an
    organization register external MCP servers as agent tools; Happyrobot connects, discovers their tools
    and caches the list.
  operations:
  - GET /mcp/ — list registered MCP servers for the organization
  - POST /mcp/ — create an MCP server connection; tests connectivity and discovers tools before saving
  - POST /mcp/{mcpId}/refresh — re-connect and refresh the discovered tool list
  - GET /mcp/authorized-orgs — organizations this MCP token may act on
