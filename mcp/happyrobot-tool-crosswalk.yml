mcp_only:
- tool: setup
  server: happyrobot-workflows
  reason: >-
    Client-side configuration only — prompts for the API key and cluster at runtime. It configures the MCP
    server process itself and has no backing REST operation.
- tool: setup
  server: happyrobot-twin
  reason: Same client-side configuration tool, shipped in the Twin server.
- tool: documentation search (name unknown)
  server: happyrobot-docs
  reason: >-
    The docs MCP server searches Happyrobot's documentation corpus, which is not exposed as REST anywhere
    in the Public API. Its tool name and inputSchema require an authenticated tools/list against
    mcp:search.
