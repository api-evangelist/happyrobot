aid: happyrobot
name: Happyrobot
description: >-
  HappyRobot is an AI orchestration platform — "the AI operating system for the real economy" — that lets
  enterprises build, govern and deploy AI agents ("AI workers") into operational workflows across logistics,
  freight brokerage, 3PL, utilities, airlines, finance, insurance, manufacturing, retail and telecom. Agents
  place and answer phone calls, send and receive email, SMS, WhatsApp and chat, read and write to TMS/ERP
  systems, and execute multi-step workflows built as node graphs in a visual builder. The Happyrobot Public
  API (v2) exposes 205 operations across 32 resource families — workflows, versions and nodes, runs, sessions
  and messages, contacts and memories, knowledge bases, phone numbers and SIP trunks, integrations, chat and
  voice tokens, signals, billing, plus a full agent-governance surface (audits, northstars, custom evals,
  adversarial tests and suites). Authentication is a bearer API key scoped to an organization and an
  environment; the platform additionally runs an Auth0 OIDC tenant for human sign-in and an OAuth 2.0
  authorization server for its MCP surface.
url: https://raw.githubusercontent.com/api-evangelist/happyrobot/refs/heads/main/apis.yml
