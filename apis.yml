x-enrichment-notes:
  documentation_access: >-
    docs.happyrobot.ai is behind an access-code gate — every path returns "Access Restricted" to anonymous
    clients. The Documentation, APIReference, GettingStarted and Pricing pointers above are Happyrobot's
    real, published documentation URLs (several are search-engine indexed), but they are NOT anonymously
    readable as of 2026-08-01. Recorded so the gap is visible rather than silently scored as open docs.
  idempotency: >-
    Deliberately NOT wired. The string "idempot" does not appear anywhere in either OpenAPI document, so no
    Idempotency pointer is emitted. See conventions/happyrobot-conventions.yml.
  agent_card: >-
    Deliberately NOT wired. /.well-known/agent-card.json and /.well-known/agent.json were probed on
    happyrobot.ai, www, platform, app, docs and mcp.platform — all 404, 302, 429, or an HTML SPA shell. No
    agent card is published, so no a2a/ artifact was authored.
  changelog: >-
    No ChangeLog pointer. No dated changelog is publicly readable — the docs changelog is behind the access
    gate and the marketing site has no changelog page or RSS feed.
  cli: >-
    No CLI artifact. The two npm binaries (happyrobot-mcp, happyrobot-mcp-twin) are MCP server entry points,
    now deprecated, not a general-purpose command-line interface.
  deprecation: >-
    No Deprecation pointer. Real deprecations exist and are recorded in lifecycle/ (the v1
    /use-cases/{use_case_id}/runs operation, and both stdio MCP npm packages), but Happyrobot publishes no
    deprecation POLICY page and supports neither the RFC 8594 Sunset header nor a Deprecation header, and
    no operation in either OpenAPI carries deprecated:true. Emitting the pointer would over-claim.
  contract_discovery: >-
    The v2 OpenAPI was NOT at any conventional docs-host path — docs.happyrobot.ai answers 200 with an
    identical application shell for /openapi.json, /llms.txt, /docs.json and every other path. The real
    687KB OpenAPI 3.0.3 is served anonymously from the API host at
    https://platform.happyrobot.ai/api/v2/docs/json (a Fastify swagger route; /api/v2/openapi.json 404s).
    Recorded so a future pass does not repeat the search.
